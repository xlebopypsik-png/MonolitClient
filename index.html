<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monolit Client — Личный кабинет</title>
    <style>
        body { 
            background-color: #0a0a0e; 
            color: #fff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .card { 
            background: #101118; 
            border: 1px solid #8B5CF6; 
            border-radius: 20px; 
            padding: 30px; 
            width: 360px; 
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.25); 
            text-align: center; 
        }
        h2 { margin-top: 0; color: #fff; font-size: 22px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            background: #181924; 
            border: 1px solid #282a3a; 
            color: #fff; 
            border-radius: 10px; 
            box-sizing: border-box; 
            outline: none;
            transition: 0.2s;
        }
        input:focus { border-color: #8B5CF6; }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px; 
            background: linear-gradient(135deg, #8B5CF6, #06B6D4); 
            border: none; 
            color: #fff; 
            font-weight: bold; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .hidden { display: none; }
        .error { color: #f43f5e; font-size: 13px; margin-top: 8px; }
        .success { color: #10b981; font-size: 13px; margin-top: 8px; }
        .link { color: #06B6D4; cursor: pointer; margin-top: 15px; display: block; font-size: 13px; }
        .link:hover { text-decoration: underline; }
        p { color: #a5aab8; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- Карточка авторизации / регистрации -->
    <div class="card" id="auth-card">
        <h2>Monolit Portal</h2>
        
        <!-- Форма Входа -->
        <div id="login-form">
            <input type="text" id="login-user" placeholder="Логин">
            <input type="password" id="login-pass" placeholder="Пароль">
            <button onclick="loginWeb()">Войти</button>
            <div id="login-msg" class="error"></div>
            <span class="link" onclick="toggleForm('register')">Нет аккаунта? Зарегистрироваться</span>
        </div>

        <!-- Форма Регистрации -->
        <div id="register-form" class="hidden">
            <input type="text" id="reg-user" placeholder="Придумайте логин">
            <input type="password" id="reg-pass" placeholder="Придумайте пароль">
            <button onclick="registerWeb()">Создать аккаунт</button>
            <div id="reg-msg" class="error"></div>
            <span class="link" onclick="toggleForm('login')">Уже есть аккаунт? Войти</span>
        </div>
    </div>

    <!-- Личный Кабинет (Скрыт до входа) -->
    <div class="card hidden" id="dashboard-card">
        <h2>Личный кабинет</h2>
        <p>Игрок: <span id="user-display" style="color: #fff; font-weight: bold;"></span></p>
        <p>Подписка активна до: <br><b id="sub-display" style="color: #8B5CF6;"></b></p>
        <p>Статус HWID: <br><b id="hwid-display" style="color: #06B6D4;"></b></p>
        
        <button onclick="resetHwid()" style="background: linear-gradient(135deg, #e11d48, #f43f5e);">Сбросить привязку HWID</button>
        <button onclick="logout()" style="background: #282a3a; margin-top: 10px;">Выйти из аккаунта</button>
        <div id="dash-msg" class="success"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api'; // При публикации в интернет замените на адрес вашего VPS-сервера

        function toggleForm(type) {
            if(type === 'register') {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('register-form').classList.remove('hidden');
            } else {
                document.getElementById('register-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
            }
        }

        async function registerWeb() {
            const username = document.getElementById('reg-user').value.trim();
            const password = document.getElementById('reg-pass').value;
            const msg = document.getElementById('reg-msg');
            msg.innerText = '';

            if(!username || !password) {
                msg.innerText = 'Заполните все поля!';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if(res.ok) {
                    alert('Регистрация успешна! Теперь вы можете войти.');
                    toggleForm('login');
                } else {
                    msg.innerText = data.error;
                }
            } catch(e) {
                msg.innerText = 'Ошибка соединения с бэкенд-сервером';
            }
        }

        async function loginWeb() {
            const username = document.getElementById('login-user').value.trim();
            const password = document.getElementById('login-pass').value;
            const msg = document.getElementById('login-msg');
            msg.innerText = '';

            try {
                const res = await fetch(`${API_URL}/login-web`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if(res.ok) {
                    localStorage.setItem('monolit_user', data.username);
                    showDashboard(data);
                } else {
                    msg.innerText = data.error;
                }
            } catch(e) {
                msg.innerText = 'Ошибка соединения с бэкенд-сервером';
            }
        }

        function showDashboard(data) {
            document.getElementById('auth-card').classList.add('hidden');
            document.getElementById('dashboard-card').classList.remove('hidden');
            document.getElementById('user-display').innerText = data.username;
            document.getElementById('sub-display').innerText = new Date(data.sub).toLocaleString();
            document.getElementById('hwid-display').innerText = data.hwid;
        }

        async function resetHwid() {
            const username = document.getElementById('user-display').innerText;
            const msg = document.getElementById('dash-msg');
            msg.innerText = '';

            try {
                const res = await fetch(`${API_URL}/reset-hwid`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                if(res.ok) {
                    msg.innerText = 'HWID успешно сброшен!';
                    document.getElementById('hwid-display').innerText = 'Не привязан';
                } else {
                    alert(data.error);
                }
            } catch(e) {
                alert('Ошибка сброса HWID');
            }
        }

        function logout() {
            localStorage.removeItem('monolit_user');
            document.getElementById('dashboard-card').classList.add('hidden');
            document.getElementById('auth-card').classList.remove('hidden');
        }
    </script>
</body>
</html>
